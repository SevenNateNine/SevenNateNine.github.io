<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Applies before the stylesheet loads, so a dark-mode visitor never gets a white flash. -->
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>Nathaniel Chan — Software Engineer</title>
    <meta
      name="description"
      content="Full-stack software engineer with five years in financial services, building on .NET, TypeScript, and React."
    />
    <link rel="canonical" href="https://sevennatenine.github.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sevennatenine.github.io/" />
    <meta property="og:title" content="Nathaniel Chan — Software Engineer" />
    <meta
      property="og:description"
      content="Full-stack software engineer with five years in financial services, building on .NET, TypeScript, and React."
    />
    <meta name="twitter:card" content="summary" />

    <!--
      Resolves the theme before first paint. Without this, a visitor whose saved
      preference differs from their OS setting sees the wrong theme flash while
      the bundle loads. Must stay inline and render-blocking.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
